<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List Task 3</title>
  </head>
  <body>
    <main class="app">
      <h1>My Tasks</h1>

      <form id="taskForm" class="task-form">
        <input
          type="text"
          id="taskInput"
          placeholder="What do you need to do?"
          autocomplete="off"
          required
        />
        <button type="submit">Add Task</button>
      </form>
    </main>
  </body>
</html>
