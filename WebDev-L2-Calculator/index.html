<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
   <section class="display" aria-label="Calculator display">
       <div id="display-history" class="display-history"></div>
       <div id="display-current" class="display-current">0</div> 
    </section>

   <section class="keypad" aria-label="Calculator keypad">
        <button class="key key-fn" data-action="clear">C</button>
        <button class="key key-fn" data-action="backspace">⌫</button>
        <button class="key key-fn" data-action="percent">%</button>
        <button class="key key-fn" data-action="operator"
         data-operator="÷">÷</button>

        <button class="key key-num" data-action="number" data-number="7">7</button>
        <button class="key key-num" data-action="number" data-number="8">8</button>
        <button class="key key-num" data-action="number" data-number="9">9</button>
        <button class="key key-op" data-action="operator"
        data-operator="×">x</button>

        
    </section>

  </main>
</body>
</html>
